{% extends "base.html" %}
{% block title %}Products · Demo Shop{% endblock %}

{% block content %}
<h1>Products</h1>

<div class="product-grid">
  {% for product in products %}
    <article class="card" data-testid="product-card" data-product-id="{{ product.id }}">
      <img src="{{ product.image }}" alt="" loading="lazy">
      <h2>{{ product.title }}</h2>
      <p class="price">${{ "%.2f"|format(product.price) }}</p>
      <form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}">
        <button type="submit" data-testid="add-to-cart-{{ product.id }}">Add to cart</button>
      </form>
    </article>
  {% else %}
    <p data-testid="products-empty">No products are available right now.</p>
  {% endfor %}
</div>
{% endblock %}
